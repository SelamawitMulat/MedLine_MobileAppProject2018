name: med_line
description: "A new Flutter project for medical portal management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  table_calendar: ^3.1.2
  intl: ^0.19.0

  # Riverpod
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  http: ^1.2.0
  crypto: ^3.0.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Utilities
  uuid: ^4.2.2
  equatable: ^2.0.5
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true